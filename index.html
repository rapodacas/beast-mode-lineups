<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>The Madres 14U — Lineups</title><style>
:root{--bg:#0f172a;--card:#1e293b;--ink:#f1f5f9;--sub:#94a3b8;--line:#334155;--gold:#fbbf24;--goldbg:#3b3418;--red:#f87171;--redbg:#3b1d1d;--accent:#38bdf8;--green:#34d399}
@media(prefers-color-scheme:light){:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--sub:#64748b;--line:#e2e8f0;--goldbg:#fef9c3;--gold:#b45309;--red:#b91c1c;--redbg:#fee2e2;--accent:#0284c7}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:40px}
header{position:sticky;top:0;background:var(--bg);padding:14px 16px 8px;border-bottom:1px solid var(--line);z-index:10}
h1{margin:0;font-size:20px}.date{color:var(--sub);font-size:13px;margin-top:2px}
.gtog{display:flex;gap:8px;margin-top:10px}
.gtog button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-size:15px;font-weight:700}
.gtog button.on{background:var(--accent);color:#001018;border-color:var(--accent)}
nav{display:flex;gap:6px;padding:10px 12px;overflow-x:auto}
nav button{white-space:nowrap;padding:8px 12px;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;font-size:13px;font-weight:600}
nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wrap{padding:0 12px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--green);margin:2px 0 8px}
.innbar{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.innbar button{width:56px;height:56px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:24px;font-weight:800}
.innbar .cur{flex:1;text-align:center}.innbar .cur .n{font-size:28px;font-weight:800}.innbar .cur .l{font-size:12px;color:var(--sub)}
.grp{margin:12px 0 4px;font-size:12px;letter-spacing:.08em;color:var(--sub);text-transform:uppercase}
.pos{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.pos .p{font-weight:800;font-size:15px;color:var(--sub);width:44px}
.pos .who{font-size:18px;font-weight:700;flex:1;text-align:right}
.pos.key{background:var(--goldbg);border-color:var(--gold)}.pos.key .p{color:var(--gold)}
.bench{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{background:var(--redbg);color:var(--red);border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
th,td{border:1px solid var(--line);padding:7px 5px;text-align:center}
th{background:var(--ink);color:var(--bg)}
td.poscell{background:var(--card);font-weight:800;color:var(--sub)}
td.key{background:var(--goldbg);color:var(--gold);font-weight:800}
td.b{background:var(--redbg);color:var(--red);font-weight:700}
.scroll{overflow-x:auto}
ol.bat{padding-left:0;list-style:none;margin:6px 0}
ol.bat li{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:6px}
ol.bat li .n{font-weight:700;flex:1}ol.bat li .o{color:var(--sub);width:28px;font-weight:800}
ol.bat li .s{color:var(--sub);font-size:12px}
.hide{display:none}.note{color:var(--sub);font-size:12px;margin:10px 2px}
</style></head><body><header><h1 id="team"></h1><div class="date" id="date"></div><div class="gtog"><button id="bG1" onclick="setGame('G1')">Game 1</button><button id="bG2" onclick="setGame('G2')">Game 2</button></div></header><nav><button data-v="inning" class="on" onclick="setView('inning')">This Inning</button><button data-v="players" onclick="setView('players')">Players</button><button data-v="coach" onclick="setView('coach')">Coach Grid</button><button data-v="batting" onclick="setView('batting')">Batting</button></nav><div class="wrap"><div class="badge" id="badge"></div><div id="inning"></div><div id="players" class="hide"></div><div id="coach" class="hide"></div><div id="batting" class="hide"></div></div><script>
const DATA={"team":"The Madres 14U","date":"Sun • Sept 13","games":{"G1":{"title":"Game 1 (9-13)","batting":[{"order":1,"name":"Sam","bench":0},{"order":2,"name":"Jules","bench":1},{"order":3,"name":"Dalilah","bench":2},{"order":4,"name":"Kandyce","bench":1},{"order":5,"name":"Carlee","bench":1},{"order":6,"name":"Noshla","bench":2},{"order":7,"name":"Alexis","bench":1},{"order":8,"name":"Alannah","bench":0},{"order":9,"name":"Elise","bench":2},{"order":10,"name":"Uushla","bench":2},{"order":11,"name":"Penelope","bench":1},{"order":12,"name":"Ileiana","bench":1},{"order":13,"name":"Tavyn","bench":2}],"grid":[{"P":"Alexis","C":"Elise","1B":"Sam","2B":"Penelope","3B":"Kandyce","SS":"Carlee","LF":"Alannah","CF":"Jules","RF":"Ileiana"},{"P":"Kandyce","C":"Jules","1B":"Sam","2B":"Uushla","3B":"Penelope","SS":"Alannah","LF":"Dalilah","CF":"Noshla","RF":"Tavyn"},{"P":"Alexis","C":"Elise","1B":"Sam","2B":"Tavyn","3B":"Kandyce","SS":"Carlee","LF":"Dalilah","CF":"Alannah","RF":"Ileiana"},{"P":"Alexis","C":"Jules","1B":"Sam","2B":"Penelope","3B":"Ileiana","SS":"Carlee","LF":"Noshla","CF":"Alannah","RF":"Uushla"}],"bench":[["Dalilah","Uushla","Noshla","Tavyn"],["Alexis","Carlee","Elise","Ileiana"],["Jules","Penelope","Uushla","Noshla"],["Dalilah","Elise","Kandyce","Tavyn"]]},"G2":{"title":"Game 2 (9-13)","batting":[{"order":1,"name":"Sam","bench":0},{"order":2,"name":"Elise","bench":2},{"order":3,"name":"Jules","bench":1},{"order":4,"name":"Uushla","bench":2},{"order":5,"name":"Dalilah","bench":1},{"order":6,"name":"Penelope","bench":1},{"order":7,"name":"Kandyce","bench":0},{"order":8,"name":"Ileiana","bench":3},{"order":9,"name":"Carlee","bench":1},{"order":10,"name":"Tavyn","bench":3},{"order":11,"name":"Noshla","bench":2},{"order":12,"name":"Alannah","bench":0},{"order":13,"name":"Alexis","bench":0}],"grid":[{"P":"Kandyce","C":"Elise","1B":"Sam","2B":"Penelope","3B":"Alexis","SS":"Carlee","LF":"Alannah","CF":"Jules","RF":"Dalilah"},{"P":"Kandyce","C":"Jules","1B":"Sam","2B":"Penelope","3B":"Alexis","SS":"Alannah","LF":"Dalilah","CF":"Noshla","RF":"Uushla"},{"P":"Kandyce","C":"Elise","1B":"Sam","2B":"Tavyn","3B":"Alexis","SS":"Carlee","LF":"Dalilah","CF":"Alannah","RF":"Ileiana"},{"P":"Kandyce","C":"Jules","1B":"Sam","2B":"Penelope","3B":"Alexis","SS":"Carlee","LF":"Noshla","CF":"Alannah","RF":"Uushla"}],"bench":[["Uushla","Noshla","Ileiana","Tavyn"],["Carlee","Elise","Ileiana","Tavyn"],["Jules","Penelope","Uushla","Noshla"],["Elise","Dalilah","Ileiana","Tavyn"]]}}};
const POSN=['P','C','1B','2B','3B','SS','LF','CF','RF'];
const KEY=new Set(['P','C','SS']);
let G='G1',INN=0;
const g=()=>DATA.games[G];
function validity(){const b=g().bench;for(let i=1;i<b.length;i++){const prev=new Set(b[i-1]);const d=b[i].find(x=>prev.has(x));if(d)return{ok:false,msg:'back-to-back sit: '+d};}return{ok:true};}
function renderBadge(){const v=validity(),el=document.getElementById('badge');el.style.color=v.ok?'var(--green)':'var(--red)';el.textContent=v.ok?'\u2713 rotation valid \u2014 no back-to-back sits':'\u26a0 '+v.msg;}
function renderInning(){const gr=g().grid[INN],bn=g().bench[INN];
 const row=p=>'<div class="pos '+(KEY.has(p)?'key':'')+'"><span class="p">'+p+'</span><span class="who">'+gr[p]+'</span></div>';
 let h='<div class="innbar"><button onclick="stepInn(-1)">\u2039</button><div class="cur"><div class="n">Inning '+(INN+1)+'</div><div class="l">P: '+gr.P+' \u00b7 C: '+gr.C+'</div></div><button onclick="stepInn(1)">\u203a</button></div>';
 h+='<div class="grp">Infield</div>'+['P','C','1B','2B','3B','SS'].map(row).join('');
 h+='<div class="grp">Outfield</div>'+['LF','CF','RF'].map(row).join('');
 h+='<div class="grp">On the bench</div><div class="bench">'+bn.map(x=>'<span class="chip">'+x+'</span>').join('')+'</div>';
 document.getElementById('inning').innerHTML=h;}
function stepInn(d){INN=(INN+d+4)%4;renderInning();}
function renderPlayers(){const bat=g().batting,grid=g().grid,bench=g().bench;
 const where=(name,i)=>{const p=POSN.find(pp=>grid[i][pp]===name);if(p)return{t:p,k:KEY.has(p)};if(bench[i].includes(name))return{t:'BENCH',b:true};return{t:'-'};};
 let h='<div class="scroll"><table><tr><th style="text-align:left">Player</th><th>1</th><th>2</th><th>3</th><th>4</th></tr>';
 bat.forEach(pl=>{h+='<tr><td class="poscell" style="text-align:left;padding-left:8px">'+pl.name+'</td>';for(let i=0;i<4;i++){const w=where(pl.name,i);h+='<td class="'+(w.b?'b':(w.k?'key':''))+'">'+w.t+'</td>';}h+='</tr>';});
 h+='</table></div><div class="note">Each row = a player. BENCH = sitting that inning. Gold = P/C/SS.</div>';
 document.getElementById('players').innerHTML=h;}
function renderCoach(){const grid=g().grid,bench=g().bench;
 let h='<div class="scroll"><table><tr><th>Pos</th><th>1</th><th>2</th><th>3</th><th>4</th></tr>';
 POSN.forEach(p=>{h+='<tr><td class="poscell">'+p+'</td>';for(let i=0;i<4;i++)h+='<td class="'+(KEY.has(p)?'key':'')+'">'+grid[i][p]+'</td>';h+='</tr>';});
 h+='<tr><td class="b">SIT</td>';for(let i=0;i<4;i++)h+='<td class="b" style="font-size:11px">'+bench[i].join('<br>')+'</td>';h+='</tr></table></div>';
 document.getElementById('coach').innerHTML=h;}
function renderBatting(){const bat=g().batting;
 let h='<ol class="bat">'+bat.map(pl=>'<li><span class="o">'+pl.order+'</span><span class="n">'+pl.name+'</span><span class="s">sits '+pl.bench+'</span></li>').join('')+'</ol>';
 h+='<div class="note">Continuous batting \u2014 all 13 hit. Game 2 is the riffle of Game 1 (balances at-bats, keeps strength).</div>';
 document.getElementById('batting').innerHTML=h;}
function renderAll(){renderBadge();renderInning();renderPlayers();renderCoach();renderBatting();}
function setGame(x){G=x;INN=0;document.getElementById('bG1').className=x==='G1'?'on':'';document.getElementById('bG2').className=x==='G2'?'on':'';renderAll();}
function setView(v){['inning','players','coach','batting'].forEach(id=>document.getElementById(id).className=id===v?'':'hide');document.querySelectorAll('nav button').forEach(b=>b.className=b.dataset.v===v?'on':'');}
document.getElementById('team').textContent=DATA.team;document.getElementById('date').textContent=DATA.date;
setGame('G1');setView('inning');
</script></body></html>

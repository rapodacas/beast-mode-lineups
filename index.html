<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a1c34"><title>Madres — Lineups</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Madres"><style>
:root{--bg:#0a1c34;--bg2:#0e2444;--card:#123056;--ink:#f4ecda;--sub:#9db2cf;--line:#1f4372;--orange:#f26a21;--pink:#ec2b8a;--cream:#f3ead6;--gold:#f6b73c;--goldbg:#3a2f13;--red:#ff6b6b;--redbg:#3a1626;--green:#3ddc97;--grass:#2f7d46;--grass2:#256b3b;--dirt:#c98a4b}
html{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:8px 0 calc(74px + env(safe-area-inset-bottom))}
.top{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:2px solid var(--orange);z-index:10;padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:center;box-shadow:0 -3px 12px rgba(0,0,0,.45)}
.gtog{display:flex;gap:6px}
.gtog button{padding:6px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font-size:13px;font-weight:800}
.gtog button.on{background:var(--orange);color:#1a0d00;border-color:var(--orange)}
nav{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0}
nav button{white-space:nowrap;padding:5px 14px;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;font-size:19px;line-height:1.1;font-weight:700}
nav button.on{background:var(--pink);color:#fff;border-color:var(--pink)}
.wrap{padding:0 12px;max-width:560px;margin:0 auto;min-height:calc(100dvh - 84px);display:flex;flex-direction:column;justify-content:flex-end}
#field{flex:1;display:flex;flex-direction:column;min-height:0}
.frow{display:block;flex:1;min-height:0}
.fcol,.bcol{display:flex;flex-direction:column;min-height:0}
.bcol ol.bat{flex:1}
@media(min-width:720px){.wrap{max-width:1060px}.frow{display:grid;grid-template-columns:1.15fr .85fr;gap:22px;align-items:stretch;height:100%}.frow .grp:first-child{margin-top:0}.fcol{justify-content:center}.fcol .field{width:min(100%,calc((100dvh - 165px) * 1.315))}.bcol ol.bat{display:flex;flex-direction:column;gap:4px}.bcol ol.bat li{flex:1}}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--green);margin:2px 0 8px}
.innbar{display:flex;align-items:center;gap:10px;margin:6px 0 10px}
.innbar button{width:54px;height:54px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:24px;font-weight:900}
.innbar .cur{flex:1;text-align:center}.innbar .cur .n{font-size:26px;font-weight:900}.innbar .cur .l{font-size:12px;color:var(--sub)}
/* diamond field */
.field{position:relative;width:100%;padding-bottom:76%}
.field svg{position:absolute;inset:0;width:100%;height:100%}
.farrow{position:absolute;top:60%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.92);color:#0a1c34;border:none;font-size:26px;font-weight:900;display:flex;align-items:center;justify-content:center;z-index:4;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.farrow.l{left:4px}.farrow.r{right:4px}
.benchbox{position:absolute;right:1.5%;bottom:1.5%;background:rgba(10,28,52,.8);border:1px solid var(--line);border-radius:9px;padding:3px 8px 4px;z-index:3}
.benchbox .bh{text-align:center;font-size:clamp(11px,2.1vw,15px);font-weight:900;letter-spacing:.05em;color:var(--sub);text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:1px;margin-bottom:2px}
.bgrid{display:grid;grid-template-columns:auto auto;gap:1px 12px}
.bgrid span{color:var(--red);font-size:clamp(11px,2.1vw,15px);font-weight:800;white-space:nowrap;line-height:1.25}
.dots{display:flex;gap:10px;justify-content:center;margin:9px 0 2px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line);border:none;padding:0}
.dot.on{background:var(--orange)}
.innlbl{position:absolute;top:2%;left:3%;color:#fff;font-weight:900;white-space:nowrap;line-height:1;z-index:3;text-shadow:0 2px 5px rgba(0,0,0,.9)}
.puck{position:absolute;transform:translate(-50%,-50%);text-align:center;width:74px;z-index:2}
.puck .c{width:40px;height:40px;border-radius:50%;margin:0 auto;background:var(--bg2);border:2px solid #fff;color:#fff;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.puck.key .c{background:var(--orange);border-color:var(--gold);color:#1a0d00}
.puck .nm{margin-top:3px;font-size:12px;font-weight:800;color:#fff;text-shadow:0 1px 3px #000;line-height:1.05}
.bench{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.chip{background:var(--redbg);color:var(--red);border:1px solid var(--red);border-radius:999px;padding:7px 13px;font-weight:800;font-size:14px}
.grp{margin:12px 0 4px;font-size:12px;letter-spacing:.08em;color:var(--sub);text-transform:uppercase}
.pos{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:7px}
.pos .p{font-weight:900;font-size:14px;color:var(--sub);width:40px}.pos .who{font-size:17px;font-weight:700}
.pos.key{background:var(--goldbg);border-color:var(--gold)}.pos.key .p{color:var(--gold)}
ol.bat{padding-left:0;list-style:none;margin:4px 0}
ol.bat li{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 10px;margin-bottom:3px;font-size:14px}
ol.bat li .o{background:var(--orange);color:#1a0d00;width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px;flex:none}
ol.bat li .n{font-weight:700;flex:1}ol.bat li .num{color:var(--gold);font-weight:900;font-size:12px;min-width:22px;text-align:right}ol.bat li .ps{color:var(--sub);font-size:11px;font-weight:800;min-width:26px;text-align:right}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
th,td{border:1px solid var(--line);padding:7px 5px;text-align:center}
th{background:var(--bg2);color:var(--ink)}
td.poscell{background:var(--card);font-weight:900;color:var(--sub)}
td.key{background:var(--goldbg);color:var(--gold);font-weight:900}
td.b{background:var(--redbg);color:var(--red);font-weight:800}
.scroll{overflow-x:auto}
.hide{display:none!important}.note{color:var(--sub);font-size:12px;margin:10px 2px}
.gdate{text-align:center;color:var(--gold);font-size:14px;font-weight:800;margin:5px 0 0;letter-spacing:.02em}
nav button.act{color:var(--ink)}

let G='G1',INN=0;
const g=()=>DATA.games[G];
function validity(){const b=g().bench;for(let i=1;i<b.length;i++){const prev=new Set(b[i-1]);const d=b[i].find(x=>prev.has(x));if(d)return{ok:false,msg:'back-to-back sit: '+d};}return{ok:true};}
function renderBadge(){const v=validity(),el=document.getElementById('badge');el.style.color=v.ok?'var(--green)':'var(--red)';el.textContent=v.ok?'\u2713 rotation valid \u2014 no back-to-back sits':'\u26a0 '+v.msg;}
function innbar(){const gr=g().grid[INN];return '<div class="innbar"><button onclick="stepInn(-1)">\u2039</button><div class="cur"><div class="n">Inning '+(INN+1)+'</div><div class="l">P: '+gr.P+' \u00b7 C: '+gr.C+'</div></div><button onclick="stepInn(1)">\u203a</button></div>';}
const ROSTER={Sam:{last:'Mendoza',num:3},Jules:{last:'Apodaca',num:13},Dalilah:{last:'Zarate',num:19},Kandyce:{last:'Grill',num:79},Carlee:{last:'Eagleton',num:14},Noshla:{last:'Turner',num:10},Alexis:{last:'Berggren',num:24},Alannah:{last:'Arguello',num:23},Elise:{last:'Resendiz',num:17},Uushla:{last:'Turner',num:6},Penelope:{last:'Cuevas',num:12},Ileiana:{last:'Aguilar',num:11},Tavyn:{last:'Green',num:22}};
function primaryPos(name){const grid=g().grid;const cnt={};grid.forEach(gi=>POSN.forEach(p=>{if(gi[p]===name)cnt[p]=(cnt[p]||0)+1;}));let best='',n=0;for(const p in cnt)if(cnt[p]>n){n=cnt[p];best=p;}return best||'\u2014';}
function batList(){const bat=g().batting;return '<ol class="bat">'+bat.map(pl=>{const r=ROSTER[pl.name]||{last:'',num:''};return '<li><span class="o">'+pl.order+'</span><span class="n">'+pl.name+(r.last?' '+r.last:'')+'</span><span class="num">'+(r.num!==''?'#'+r.num:'')+'</span><span class="ps">'+primaryPos(pl.name)+'</span></li>';}).join('')+'</ol>';}
function benchRow(){return '<div class="grp">On the bench</div><div class="bench">'+g().bench[INN].map(x=>'<span class="chip">'+x+'</span>').join('')+'</div>';}
function renderField(){const gr=g().grid[INN];
 let pucks=POSN.map(p=>{const[x,y]=COORD[p];return '<div class="puck '+(KEY.has(p)?'key':'')+'" style="left:'+x+'%;top:'+y+'%"><div class="c">'+p+'</div><div class="nm">'+gr[p]+'</div></div>';}).join('');
 const innlabel='<div class="innlbl">Inning '+(INN+1)+'</div>';
 const arrows='<button class="farrow l" onclick="stepInn(-1)">\u2039</button><button class="farrow r" onclick="stepInn(1)">\u203a</button>';
 const bn=g().bench[INN];
 const bench='<div class="benchbox"><div class="bh">Bench</div><div class="bgrid">'+bn.map(x=>'<span>'+x+'</span>').join('')+'</div></div>';
 const dots='<div class="dots">'+[0,1,2,3].map(i=>'<button class="dot '+(i===INN?'on':'')+'" onclick="gotoInn('+i+')"></button>').join('')+'</div>';
 const gdate='<div class="gdate">'+(DATA.date||'')+'</div>';
 document.getElementById('field').innerHTML='<div class="frow"><div class="fcol"><div class="field">'+FIELD_SVG+pucks+innlabel+arrows+bench+'</div>'+dots+gdate+'</div><div class="bcol">'+batList()+'</div></div>';
 const _f=document.querySelector('.field'),_l=document.querySelector('.innlbl');
 if(_f&&_l){_l.style.fontSize='24px';_l.style.fontSize=Math.max(11,24*(_f.clientWidth*0.33)/(_l.offsetWidth||1))+'px';}}
function stepInn(d){INN=(INN+d+4)%4;renderField();}
function gotoInn(i){INN=i;renderField();}
async function refreshData(){try{if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}if(navigator.serviceWorker){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.update()));}}catch(e){}location.reload(true);}
function renderInning(){const gr=g().grid[INN];
 const row=p=>'<div class="pos '+(KEY.has(p)?'key':'')+'"><span class="p">'+p+'</span><span class="who">'+gr[p]+'</span></div>';
 let h=innbar()+'<div class="grp">Infield</div>'+['P','C','1B','2B','3B','SS'].map(row).join('')+'<div class="grp">Outfield</div>'+['LF','CF','RF'].map(row).join('')+benchRow();
 document.getElementById('inning').innerHTML=h;}
function renderPlayers(){const bat=g().batting,grid=g().grid,bench=g().bench;
 const where=(name,i)=>{const p=POSN.find(pp=>grid[i][pp]===name);if(p)return{t:p,k:KEY.has(p)};if(bench[i].includes(name))return{t:'BENCH',b:true};return{t:'-'};};
 let h='<div class="scroll"><table><tr><th style="text-align:left">Player</th><th>1</th><th>2</th><th>3</th><th>4</th></tr>';
 bat.forEach(pl=>{h+='<tr><td class="poscell" style="text-align:left;padding-left:8px">'+pl.name+'</td>';for(let i=0;i<4;i++){const w=where(pl.name,i);h+='<td class="'+(w.b?'b':(w.k?'key':''))+'">'+w.t+'</td>';}h+='</tr>';});
 h+='</table></div><div class="note">Each row = a player. BENCH = sitting. Orange = P/C/SS.</div>';document.getElementById('players').innerHTML=h;}
function renderCoach(){const grid=g().grid,bench=g().bench;
 let h='<div class="scroll"><table><tr><th>Pos</th><th>1</th><th>2</th><th>3</th><th>4</th></tr>';
 POSN.forEach(p=>{h+='<tr><td class="poscell">'+p+'</td>';for(let i=0;i<4;i++)h+='<td class="'+(KEY.has(p)?'key':'')+'">'+grid[i][p]+'</td>';h+='</tr>';});
 h+='<tr><td class="b">SIT</td>';for(let i=0;i<4;i++)h+='<td class="b" style="font-size:11px">'+bench[i].join('<br>')+'</td>';h+='</tr></table></div>';document.getElementById('coach').innerHTML=h;}
function renderAll(){renderField();renderPlayers();renderCoach();}
function setGame(x){G=x;INN=0;document.getElementById('bG1').className=x==='G1'?'on':'';document.getElementById('bG2').className=x==='G2'?'on':'';renderAll();}
function setView(v){['field','players','coach'].forEach(id=>document.getElementById(id).className=id===v?'':'hide');document.querySelectorAll('nav button[data-v]').forEach(b=>b.className=b.dataset.v===v?'on':'');}
setGame('G1');setView('field');
